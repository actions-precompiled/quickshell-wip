name: Build Artifacts (dry run)

# Pushes and PRs never publish releases — only prove the build and upload tarballs.
on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

# One active run per workflow+ref; newer pushes cancel older builds.
concurrency:
  group: build-artifacts-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      build_tag: ${{ steps.plan.outputs.build_tag }}
      missing: ${{ steps.plan.outputs.missing }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Dry-run plan (missing releases + smoke-build tag)
        id: plan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python3 <<'PY'
          import json, os, importlib.machinery, importlib.util
          from pathlib import Path

          out = Path(os.environ["GITHUB_OUTPUT"])
          summary = Path(os.environ["GITHUB_STEP_SUMMARY"])

          # create_releases is an extensionless uv script — force SourceFileLoader
          path = Path("create_releases").resolve()
          loader = importlib.machinery.SourceFileLoader("create_releases", str(path))
          spec = importlib.util.spec_from_loader(loader.name, loader)
          assert spec is not None and spec.loader is not None
          mod = importlib.util.module_from_spec(spec)
          loader.exec_module(mod)

          missing = mod.versions_to_build([])
          # Newest upstream release tag (curl → system CA store)
          latest = mod.github_api_json(
              "/repos/quickshell-mirror/quickshell/releases/latest"
          )["tag_name"]

          missing_json = json.dumps(missing)
          print(f"Latest upstream: {latest}")
          print(f"Missing releases (dry-run): {missing_json}")

          with out.open("a", encoding="utf-8") as fh:
              fh.write(f"build_tag={latest}\n")
              fh.write(f"missing={missing_json}\n")

          with summary.open("a", encoding="utf-8") as fh:
              fh.write("## Dry-run plan\n\n")
              fh.write(f"- Smoke-build tag: `{latest}`\n")
              fh.write(f"- Missing releases (would publish on workflow_dispatch): ")
              if missing:
                  fh.write(", ".join(f"`{v}`" for v in missing) + "\n")
              else:
                  fh.write("_none_\n")
              fh.write("\nNo GitHub releases are created on push/PR.\n")
          PY

  build:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            runner: ubuntu-latest
          - target: linux-aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build buildenv image (native arch)
        run: |
          case "$(uname -m)" in
            x86_64|amd64) ARCH=amd64 ;;
            aarch64|arm64) ARCH=arm64 ;;
            *) echo "unsupported arch: $(uname -m)" >&2; exit 1 ;;
          esac
          docker build --build-arg "TARGETARCH=${ARCH}" -t quickshell-buildenv:local .


      - name: Install mise tools (uv)
        uses: jdx/mise-action@v2

      - name: Build tarball (no smoke — upload first)
        env:
          SKIP_IMAGE_BUILD: "1"
          IMAGE_NAME: quickshell-buildenv
          IMAGE_TAG: local
          TARGETS: ${{ matrix.target }}
        run: ./create_releases --skip-smoke "${{ needs.plan.outputs.build_tag }}"

      - name: Upload tarball artifact
        uses: actions/upload-artifact@v4
        if: success() || failure()
        with:
          name: quickshell-${{ needs.plan.outputs.build_tag }}-${{ matrix.target }}
          path: target/${{ matrix.target }}/*.tar.gz
          if-no-files-found: warn
          retention-days: 7

      - name: Install Xvfb + host runtime libs for smoke
        if: success()
        run: |
          # Tarball vendors Qt; desktop stack (pipewire, wayland, GL, …) comes from the host.
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb \
            libgl1 \
            libegl1 \
            libglx-mesa0 \
            libgbm1 \
            libdrm2 \
            libpipewire-0.3-0t64 \
            libspa-0.2-modules \
            libwayland-client0 \
            libwayland-cursor0 \
            libwayland-egl1 \
            libwayland-server0 \
            libxkbcommon0 \
            libxkbcommon-x11-0 \
            libdbus-1-3 \
            libfontconfig1 \
            libfreetype6 \
            libpam0g \
            libpolkit-agent-1-0 \
            libglib2.0-0t64 \
            libx11-6 \
            libx11-xcb1 \
            libxcb1 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xfixes0 \
            libxcb-xkb1

      - name: Smoke test package (under Xvfb)
        if: success()
        env:
          TARGETS: ${{ matrix.target }}
          QT_QPA_PLATFORM: xcb
        run: ./create_releases --smoke-only "${{ needs.plan.outputs.build_tag }}"

      - name: List artifacts
        if: always()
        run: find target -type f -exec ls -lh {} \; || true
